name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*.*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Download Dalamud Hooks
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
        Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncherCN\addon\Hooks\dev"

    - name: Restore
      run: dotnet restore TreasureHunt/TreasureHunt.csproj

    - name: Build
      run: dotnet build --no-restore -c Release TreasureHunt/TreasureHunt.csproj --output ./build

    - name: Cleanup output
      shell: pwsh
      run: |
        Remove-Item ./build/*.pdb -Force -ErrorAction SilentlyContinue
        Remove-Item ./build/TreasureHunt -Recurse -Force -ErrorAction SilentlyContinue

    - name: Create plugin zip
      shell: pwsh
      run: |
        Compress-Archive -Path ./build/* -DestinationPath TreasureHunt.zip

    - name: Extract version from tag
      id: version
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag.TrimStart('v')
        Write-Host "Version: $version"
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "TAG=$tag" >> $env:GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.TAG }}
        name: TreasureHunt ${{ steps.version.outputs.TAG }}
        make_latest: latest
        body: |
          ## TreasureHunt ${{ steps.version.outputs.TAG }}

          ### 安装方式
          1. 在 XIVLauncher 设置中添加自定义仓库：
             `https://raw.githubusercontent.com/wenliang110/TreasureHunt/main/repo.json`
          2. 在插件管理器中搜索 TreasureHunt 并安装
          3. 游戏内输入 `/th` 打开主窗口

          ### 功能
          - 自动购买藏宝图 (交易板)
          - 自动解读藏宝图并标记位置
          - 自动传送到最近水晶
          - 自动导航到挖宝点
          - 自动挖掘
          - 进洞自动交互
          - TP 钱袋子奖励房自动收集
        files: |
          TreasureHunt.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
